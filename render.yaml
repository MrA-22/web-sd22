services:
  # Konfigurasi Backend (Laravel Docker)
  - type: web
    name: websekolah-backend
    runtime: docker
    plan: free
    rootDir: BackEnd
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-south-1.pooler.supabase.com
      - key: DB_PORT
        value: 6543
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.nhesrzzxsedtzbqmguft
      - key: DB_PASSWORD
        value: Arifgoogle!?1

  # Konfigurasi Frontend (React + Vite)
  - type: web
    name: websekolah-frontend
    runtime: node
    plan: free
    rootDir: FrontEnd
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0